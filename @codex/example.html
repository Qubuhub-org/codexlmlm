<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101827" />
    <meta name="description" content="A responsive standalone React 18 development demo for CodexLMLM." />
    <title>CodexLMLM — React demo</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone keeps this one-file JSX demo easy to open; development only. -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101827; color: #edf2f7; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background: radial-gradient(ellipse at 15% 0%, #243b60 0, transparent 42%), radial-gradient(ellipse at 100% 100%, #193c3a 0, transparent 38%), #101827; }
      .shell { display: flex; min-height: 100vh; flex-direction: column; }
      .topbar, footer { display: flex; width: min(100% - 40px, 1080px); align-items: center; justify-content: space-between; gap: 16px; margin: 0 auto; }
      .topbar { padding: 24px 0; }
      .brand { display: inline-flex; align-items: center; gap: 11px; color: #f8fafc; font-weight: 750; letter-spacing: -.03em; }
      .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid #6ee7b7; border-radius: 11px; background: #123d39; color: #a7f3d0; }
      .environment { border: 1px solid #334155; border-radius: 999px; padding: 7px 11px; color: #cbd5e1; font-size: .72rem; font-weight: 650; letter-spacing: .04em; }
      main { display: grid; width: min(100% - 40px, 1080px); flex: 1; align-content: center; margin: 0 auto; padding: 48px 0 80px; }
      .hero { max-width: 720px; margin: 0 auto; text-align: center; }
      .eyebrow { margin: 0 0 16px; color: #6ee7b7; font-size: .75rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; color: #f8fafc; font-size: clamp(2.4rem, 8vw, 5rem); font-weight: 800; letter-spacing: -.065em; line-height: 1.02; }
      .intro { max-width: 560px; margin: 22px auto 0; color: #b8c5d6; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.7; }
      .demo-card { width: min(100%, 520px); margin: 42px auto 0; border: 1px solid #334155; border-radius: 20px; padding: clamp(22px, 5vw, 34px); background: rgb(15 23 42 / 78%); box-shadow: 0 24px 80px rgb(0 0 0 / 24%); text-align: left; }
      .card-label { margin: 0 0 12px; color: #94a3b8; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .demo-card h2 { margin: 0; color: #f8fafc; font-size: clamp(1.4rem, 4vw, 1.8rem); letter-spacing: -.04em; }
      .demo-card p:last-child { margin: 12px 0 0; color: #b8c5d6; line-height: 1.65; }
      footer { justify-content: center; padding: 20px 0 28px; color: #8493a8; font-size: .78rem; text-align: center; }
      .load-error { width: min(100% - 40px, 640px); margin: 48px auto; border: 1px solid #7f1d1d; border-radius: 12px; padding: 18px; background: #450a0a; color: #fecaca; line-height: 1.6; }
      @media (max-width: 520px) { .topbar, footer { width: min(100% - 28px, 1080px); } .topbar { padding: 18px 0; } main { width: min(100% - 28px, 1080px); padding: 36px 0 56px; } .environment { font-size: .66rem; } .demo-card { margin-top: 32px; } }
      @media (prefers-reduced-motion: no-preference) { .hero { animation: enter 500ms ease-out both; } @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } }
    </style>
  </head>
  <body>
    <div id="root"><p class="load-error" role="status">Loading CodexLMLM. An internet connection is required for the React and Babel development CDNs.</p></div>
    <script type="text/babel">
      function MyApp() {
        return (
          <div className="shell">
            <header className="topbar">
              <div className="brand" aria-label="CodexLMLM">
                <span className="brand-mark" aria-hidden="true">C</span>
                <span>CodexLMLM</span>
              </div>
              <span className="environment">REACT 18 · DEMO</span>
            </header>
            <main>
              <section className="hero" aria-labelledby="page-title">
                <p className="eyebrow">Intelligent development workspace</p>
                <h1 id="page-title">CodexLMLM</h1>
                <p className="intro">A standalone React demonstration with a responsive layout, ready to open in a modern browser.</p>
                <article className="demo-card">
                  <p className="card-label">React mount verified</p>
                  <h2>Hello, world!</h2>
                  <p>The <code>MyApp</code> component is mounted into <code>#root</code> using React 18 <code>createRoot()</code>.</p>
                </article>
              </section>
            </main>
            <footer>CodexLMLM · Standalone development demo · Not a production build</footer>
          </div>
        );
      }

      const container = document.getElementById("root");
      if (container && window.React && window.ReactDOM) {
        ReactDOM.createRoot(container).render(<MyApp />);
      } else if (container) {
        container.innerHTML = '<p class="load-error" role="alert">Could not load React. Check your internet connection and refresh this page.</p>';
      }
    </script>
  </body>
</html>
